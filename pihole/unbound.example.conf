# Sanitized Unbound config: the recursive resolver behind Pi-hole.
#
# Chain: clients -> Pi-hole (filtering/blocklists) -> Unbound (this) -> DNS roots.
#
# Why run Unbound at all, instead of pointing Pi-hole at 1.1.1.1 or 8.8.8.8:
# full recursive resolution means no single public resolver is handed the
# household's complete DNS history. Pi-hole is the policy layer (what gets
# blocked); Unbound is the privacy layer (who gets to see the queries).
# It is not encryption: recursive queries leave in plaintext, so the ISP can
# still see them on the wire.
#
# Listens on localhost only. Pi-hole runs on the same host and is the only
# client. The rest of the network talks to Pi-hole, never to Unbound directly.

server:
    # Local-only: Pi-hole forwards to 127.0.0.1#5335
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no

    # Only this host may query
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # Root hints (update periodically)
    root-hints: "/var/lib/unbound/root.hints"

    # --- Hardening ---
    harden-glue: yes

    # This line is what actually turns on DNSSEC validation: the root trust
    # anchor, kept up to date via unbound-anchor. Without it, the DNSSEC
    # options below have nothing to validate against.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # If a signed zone's answer arrives with its DNSSEC records stripped,
    # treat it as bogus rather than quietly downgrading to insecure.
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    hide-identity: yes
    hide-version: yes

    # --- Privacy ---
    qname-minimisation: yes          # send each upstream server only the label it needs

    # --- Performance / cache ---
    edns-buffer-size: 1232
    prefetch: yes                    # refresh popular entries before they expire
    cache-min-ttl: 300
    cache-max-ttl: 86400
    num-threads: 1                   # small host, single-digit qps; keep it simple

    # DNS rebinding protection: strip private addresses out of answers that
    # come back from public DNS, so an outside name can't point a browser at
    # something inside. This filters answers. It does not stop queries for
    # private names from going upstream; that takes local zones. Unbound
    # already answers RFC1918 reverse lookups from its built-in default zones,
    # and an internal forward zone needs its own line, for example:
    #   local-zone: "lan." static
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16

# NOTE ON FALLBACK: pure recursion depends on this one box. My first answer was
# to give Pi-hole a public resolver as its second upstream. That was a mistake I
# only understood later: Pi-hole does not hold a second upstream in reserve. It
# sends ordinary queries to either one, so the public resolver saw part of the
# household's lookups even while Unbound was healthy. The fix was a second
# identical Pi-hole plus Unbound box on different hardware, kept in sync with the
# first, with clients given both addresses. Unbound is the only upstream on each.
